name: Browser E2E

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [export, live]
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test candidate Pages export
        if: matrix.target == 'export'
        run: npm run test:e2e
      - name: Test deployed live app
        if: matrix.target == 'live'
        run: npm run test:e2e:live
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
